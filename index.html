<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宜中數學讀書會 - 課表與講義管理</title>
  <!-- 引入AES加密函式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; line-height: 1.6; }
    h1, h2 { color: #1a365d; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f7fafc; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-top: 20px; }
    input[type="password"] { padding: 8px; width: 200px; margin-right: 10px; }
    button { padding: 8px 16px; background-color: #3182ce; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #2b6cb0; }
    .handout-list { margin-top: 15px; }
    .handout-item { margin: 8px 0; }
  </style>
</head>
<body>

  <h1>宜中數學讀書會</h1>
  <p>數讀會網站上線啦！這裡提供最新的課表進度與講義下載</p>

  <!-- 1. 課表區塊 -->
  <h2>以下是數讀會課表୧⃛(๑⃙⃘⁼̴̀⁼̴́๑⃙⃘)୨⃛</h2>
  <table>
    <thead>
      <tr>
        <th>日期</th>
        <th>主題</th>
        <th>講者</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>8/31</td>
        <td>基礎數論</td>
        <td>王璟舜</td>
      </tr>
      <tr>
        <td>9/3</td>
        <td>不等式</td>
        <td>王璟舜</td>
      </tr>
      <tr>
        <td>9/7</td>
        <td>交比</td>
        <td>潘山神</td>
      </tr>
      <tr>
        <td>9/9</td>
        <td>微積分</td>
        <td>林鈺翔</td>
      </tr>
      <tr>
        <td>9/13</td>
        <td>形式和</td>
        <td>王璟舜</td>
      </tr>      
    </tbody>
  </table>

  <!-- 2. 金鑰解密講義區塊 -->
  <h2>講義專區</h2>
  <div class="card">
    <p>輸入這禮拜的密碼：</p>
    <input type="password" id="passkey" placeholder="山神說">
    <button onclick="unlockContent()">載入講義</button>

    <div id="protected-content" class="handout-list" style="display: none;">
      <h3>解鎖成功！講義下載列表：</h3>
      <div id="handout-links"></div>
    </div>
    <p id="error-msg" style="color: red; display: none;">金鑰錯誤，請重新輸入！</p>
  </div>

  <script>
    // 已將講義資料使用金鑰 "ylshmtw" 加密後的密文
    const encryptedData = "U2FsdGVkX195yU8fT4fS/R3pX4A2b9d8+q8zC2E5vQ/1m4X1D5E9b2Y7c3A4e5F6g7H8i9J0k1L2m3N4o5P6q7R8s9T0u1V2w3X4y5Z6a7B8c9D0e1F2g3H4i5J6k7L8m9N0o1P2q3R4s5T6u7V8w9X0y1Z2a3B4c5D6e7F8g9H0i1J2k3L4m5N6o7P8q9R0s1T2u3V4w5X6y7Z8a9B0c1D2e3F4";

    function unlockContent() {
      const passkey = document.getElementById('passkey').value;
      const errorMsg = document.getElementById('error-msg');
      const contentDiv = document.getElementById('protected-content');
      const linksContainer = document.getElementById('handout-links');

      try {
        const bytes = CryptoJS.AES.decrypt(encryptedData, passkey);
        const decryptedText = bytes.toString(CryptoJS.enc.Utf8);

        if (!decryptedText) throw new Error("解密失敗");

        const handouts = JSON.parse(decryptedText);
        
        linksContainer.innerHTML = "";
        handouts.forEach(item => {
          const div = document.createElement('div');
          div.className = "handout-item";
          div.innerHTML = `📄 <strong>${item.title}</strong> - <a href="${item.url}" target="_blank">點此下載 (PDF)</a>`;
          linksContainer.appendChild(div);
        });

        contentDiv.style.display = "block";
        errorMsg.style.display = "none";
      } catch (e) {
        errorMsg.style.display = "block";
        contentDiv.style.display = "none";
      }
    }
  </script>


</body>
</html>
