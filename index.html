<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宜中數學讀書會</title>
<style>
  body { 
    font-family: Arial, sans-serif; 
    max-width: 800px; 
    margin: 30px auto; 
    padding: 0 20px; 
    line-height: 1.6;
    color: #ffffff;

    /* 關鍵：讀取你剛剛上傳的圖片檔名，並疊加半透明深色遮罩確保文字清晰 */
    background-image: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('bg.jpg');

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  h1, h2 { color: #60a5fa; }
  
  /* 表格透明玻璃感 */
  table { width: 100%; border-collapse: collapse; margin: 20px 0; background: rgba(255, 255, 255, 0.1); border-radius: 8px; overflow: hidden; backdrop-filter: blur(5px); }
  th, td { border: 1px solid rgba(255, 255, 255, 0.2); padding: 12px; text-align: left; }
  th { background-color: rgba(30, 58, 138, 0.5); color: #93c5fd; }
  
  /* 卡片毛玻璃效果 */
  .card { 
    background: rgba(15, 23, 42, 0.75); 
    border: 1px solid rgba(255, 255, 255, 0.2); 
    padding: 20px; 
    border-radius: 12px; 
    margin-top: 20px; 
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  input[type="password"] { 
    padding: 10px; 
    width: 200px; 
    margin-right: 10px; 
    border-radius: 6px; 
    border: 1px solid #475569;
    background: rgba(255, 255, 255, 0.9);
  }

  button { 
    padding: 10px 18px; 
    background-color: #2563eb; 
    color: white; 
    border: none; 
    border-radius: 6px; 
    cursor: pointer; 
    font-weight: bold;
  }
  button:hover { background-color: #1d4ed8; }

  .handout-list { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; }
  .handout-item { margin: 10px 0; font-size: 1.05em; }
  .handout-item a { color: #38bdf8; text-decoration: none; font-weight: bold; }
  .handout-item a:hover { text-decoration: underline; }
</style>

</head>
<body>

  <h1>宜中數學讀書會</h1>
  <p>數讀會網站上線啦！這裡提供最新的課表進度與講義下載</p>

  <!-- 1. 課表區塊 -->
  <h2>以下是數讀會課表୧⃛(๑⃙⃘⁼̴̀⁼̴́๑⃙⃘)୨⃛</h2>
  <table>
    <thead>
      <tr>
        <th>日期</th>
        <th>主題</th>
        <th>講者</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>8/31</td>
        <td>基礎數論</td>
        <td>王璟舜</td>
      </tr>
      <tr>
        <td>9/3</td>
        <td>不等式</td>
        <td>王璟舜</td>
      </tr>
      <tr>
        <td>9/7</td>
        <td>交比</td>
        <td>潘山神</td>
      </tr>
      <tr>
        <td>9/9</td>
        <td>微積分</td>
        <td>林鈺翔</td>
      </tr>
      <tr>
        <td>9/13</td>
        <td>形式和</td>
        <td>王璟舜</td>
      </tr>
      <tr>
        <td>9/15</td>
        <td>待定</td>
        <td>待定</td>
      </tr>      
    </tbody>
  </table>

  <!-- 2. 講義專區 -->
  <h2>講義專區</h2>
  <div class="card">
    <p>輸入這禮拜的密碼：</p>
    <input type="password" id="passkey" placeholder="山神說">
    <button onclick="unlockContent()">載入講義</button>

    <div id="protected-content" class="handout-list" style="display: none;">
      <h3>全對！講義們：</h3>
      <div id="handout-links"></div>
    </div>
    <p id="error-msg" style="color: red; display: none;">錯誤，請重新輸入！</p>
  </div>

<script>
  function unlockContent() {
    const passkey = document.getElementById('passkey').value.trim();
    const errorMsg = document.getElementById('error-msg');
    const contentDiv = document.getElementById('protected-content');
    const linksContainer = document.getElementById('handout-links');

    // 只要輸入 ylshmtw 就直接解鎖
    if (passkey === "ylshmtw") {
      linksContainer.innerHTML = `
        <div class="handout-item"><strong>8/31 講義：數論入門.pdf</strong> - <a href="https://drive.google.com/file/d/16PnsmJES5qG_V24EuqWVBSiwv-Bsti4u/view?usp=drivesdk" target="_blank">點我看講義</a></div>
        <div class="handout-item"><strong>9/3 講義：不等式.pdf</strong> - <a href="https://drive.google.com/file/d/1-Ge7rdtjtWZIWNDFP6xEPhFR09R9vKVa/view?usp=drivesdk" target="_blank">點我看講義</a></div>
      `;
      contentDiv.style.display = "block";
      errorMsg.style.display = "none";
    } else {
      errorMsg.style.display = "block";
      contentDiv.style.display = "none";
    }
  }
</script>

</body>
</html>
