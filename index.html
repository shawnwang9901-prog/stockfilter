<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宜中數學讀書會</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; line-height: 1.6; }
    h1, h2 { color: #1a365d; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f7fafc; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-top: 20px; }
    input[type="password"] { padding: 8px; width: 200px; margin-right: 10px; }
    button { padding: 8px 16px; background-color: #3182ce; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #2b6cb0; }
    .handout-list { margin-top: 15px; }
    .handout-item { margin: 8px 0; }
  </style>
</head>
<body>

  <h1>宜中數學讀書會</h1>
  <p>數讀會網站上線啦！這裡提供最新的課表進度與講義下載</p>

  <!-- 1. 課表區塊 -->
  <h2>以下是數讀會課表୧⃛(๑⃙⃘⁼̴̀⁼̴́๑⃙⃘)୨⃛</h2>
  <table>
    <thead>
      <tr>
        <th>日期</th>
        <th>主題</th>
        <th>講者</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>8/31</td>
        <td>基礎數論</td>
        <td>王璟舜</td>
      </tr>
      <tr>
        <td>9/3</td>
        <td>不等式</td>
        <td>王璟舜</td>
      </tr>
      <tr>
        <td>9/7</td>
        <td>交比</td>
        <td>潘山神</td>
      </tr>
      <tr>
        <td>9/9</td>
        <td>微積分</td>
        <td>林鈺翔</td>
      </tr>
      <tr>
        <td>9/13</td>
        <td>形式和</td>
        <td>王璟舜</td>
      </tr>
      <tr>
        <td>9/15</td>
        <td>待定</td>
        <td>待定</td>
      </tr>      
    </tbody>
  </table>

  <!-- 2. 講義專區 -->
  <h2>講義專區</h2>
  <div class="card">
    <p>輸入這禮拜的密碼：</p>
    <input type="password" id="passkey" placeholder="山神說">
    <button onclick="unlockContent()">載入講義</button>

    <div id="protected-content" class="handout-list" style="display: none;">
      <h3>解鎖成功！講義下載列表：</h3>
      <div id="handout-links"></div>
    </div>
    <p id="error-msg" style="color: red; display: none;">金鑰錯誤，請重新輸入！</p>
  </div>

  <script>
    // 原生解密邏輯：利用字串互斥掩碼混淆，不需要下載任何 CryptoJS 外掛
    function nativeDecrypt(cipherB64, key) {
      try {
        const raw = atob(cipherB64);
        let result = '';
        for (let i = 0; i < raw.length; i++) {
          result += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        }
        return result;
      } catch (e) {
        return null;
      }
    }

    // 針對密碼 "ylshmtw" 產生的原生混淆密文
    const encryptedData = "ARsSABcxU0BAVkNCS1IWA1hWDRkTF1IHEAEGBwkHFA4fEAMKHBcAFlhWARkaEh8RBAxWUx0RFgwQBh8TBxQOHxAD";

    function unlockContent() {
      const passkey = document.getElementById('passkey').value.trim();
      const errorMsg = document.getElementById('error-msg');
      const contentDiv = document.getElementById('protected-content');
      const linksContainer = document.getElementById('handout-links');

      // 直接使用瀏覽器內建 JS 解密
      const decryptedText = nativeDecrypt(encryptedData, passkey);

      // 驗證解密內容是否為正確的 JSON 講義格式
      if (decryptedText && decryptedText.trim().startsWith('[')) {
        try {
          const handouts = JSON.parse(decryptedText);
          
          linksContainer.innerHTML = "";
          handouts.forEach(item => {
            const div = document.createElement('div');
            div.className = "handout-item";
            div.innerHTML = `📄 <strong>${item.title}</strong> - <a href="${item.url}" target="_blank">點此下載 (PDF)</a>`;
            linksContainer.appendChild(div);
          });

          contentDiv.style.display = "block";
          errorMsg.style.display = "none";
          return;
        } catch (e) {}
      }

      // 解密失敗時顯示錯誤
      errorMsg.style.display = "block";
      contentDiv.style.display = "none";
    }
  </script>

</body>
</html>
